<script>
      export default {
  async fetch(request, env, ctx) {
    const url = new URL(request.url);

    // البروكسي: إذا كان الطلب من t.aqar1.com
    if (url.hostname === "t.aqar1.com") {
      return handlePostHogProxy(request);
    }

    // الموقع الأساسي: taif.aqar1.com (يمرر الطلب كما هو)
    return fetch(request);
  },
};

async function handlePostHogProxy(request) {
  const url = new URL(request.url);
  const path = url.pathname;
  
  // تحديد السيرفر المناسب
  const isAssets = path.startsWith("/static/");
  const host = isAssets ? "us-assets.i.posthog.com" : "us.i.posthog.com";
  
  // بناء الرابط الجديد
  const targetUrl = new URL(request.url);
  targetUrl.hostname = host;

  // إنشاء الطلب الجديد
  const newRequest = new Request(targetUrl, {
    method: request.method,
    headers: request.headers,
    body: request.body,
    redirect: "follow"
  });
  
  // إضافة headers مهمة
  newRequest.headers.set("X-Forwarded-Host", url.hostname);
  newRequest.headers.set("X-Real-IP", request.headers.get("CF-Connecting-IP") || "");

  // إرسال الطلب وإرجاع الاستجابة
  const response = await fetch(newRequest);
  
  // إرجاع الاستجابة مع السماح بـ CORS
  return new Response(response.body, {
    status: response.status,
    statusText: response.statusText,
    headers: {
      ...Object.fromEntries(response.headers),
      "Access-Control-Allow-Origin": "*",
      "Access-Control-Allow-Methods": "GET, POST, OPTIONS",
      "Access-Control-Allow-Headers": "Content-Type"
    }
  });
}
